			<!-- Photo slider: prev/next through several photos of one topic -->
				<script>
				(function () {
					document.querySelectorAll('.photo-slider').forEach(function (fig) {
						var wrap = fig.querySelector('.slides');
						var slides = Array.prototype.slice.call(wrap.querySelectorAll('a'));
						var caption = fig.querySelector('figcaption');
						if (slides.length < 2) { if (slides[0]) slides[0].classList.add('is-active'); return; }

						var idx = 0;

						var prev = document.createElement('button');
						prev.type = 'button'; prev.className = 'slider-btn prev';
						prev.setAttribute('aria-label', 'Previous photo'); prev.innerHTML = '&#8249;';
						var next = document.createElement('button');
						next.type = 'button'; next.className = 'slider-btn next';
						next.setAttribute('aria-label', 'Next photo'); next.innerHTML = '&#8250;';
						var count = document.createElement('span'); count.className = 'slide-count';
						var dots = document.createElement('div'); dots.className = 'slide-dots';
						slides.forEach(function () { dots.appendChild(document.createElement('span')); });
						wrap.appendChild(prev); wrap.appendChild(next); wrap.appendChild(count); wrap.appendChild(dots);

						function show(i) {
							idx = (i + slides.length) % slides.length;
							slides.forEach(function (s, k) { s.classList.toggle('is-active', k === idx); });
							Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-active', k === idx); });
							count.textContent = (idx + 1) + ' / ' + slides.length;
							var c = slides[idx].getAttribute('data-caption');
							if (caption && c) caption.innerHTML = c;
						}
						prev.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); show(idx - 1); });
						next.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); show(idx + 1); });

						// Touch swipe
						var startX = null;
						wrap.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
						wrap.addEventListener('touchend', function (e) {
							if (startX === null) return;
							var dx = e.changedTouches[0].clientX - startX; startX = null;
							if (Math.abs(dx) > 40) show(dx < 0 ? idx + 1 : idx - 1);
						}, { passive: true });

						show(0);
					});
				})();
				</script>
